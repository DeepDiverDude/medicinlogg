<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medicinlogg</title>
    
    <!-- Gör sidan snyggare i "app-mode" på mobil (PWA-stöd) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #ffffff;
            text-align: center;
            font-weight: 800;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
        }

        .log-list {
            list-style: none;
            width: 100%;
        }

        .log-item {
            background: #1a1a1a;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1rem;
            border-left: 5px solid #4CAF50;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .log-item.critical {
            border-left-color: #ff4d4d;
        }

        .log-date {
            color: #aaaaaa;
            font-weight: 500;
            width: 30%;
            text-align: left;
        }

        .log-time {
            font-weight: 700;
            color: #ffffff;
            width: 40%;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .log-battery {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 25%;
        }

        .footer-section {
            margin-top: 30px;
            width: 100%;
            padding-bottom: 20px;
        }

        .action-btn {
            background: #2a1a1a;
            color: #ff6b6b;
            border: none;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            text-align: center;
        }

        .action-btn:active {
            background: #3a2222;
            transform: scale(0.98);
        }

        .loading {
            text-align: center;
            color: #777;
            margin-top: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MEDICINLOGG</h1>
        
        <div id="loading" class="loading">Hämtar loggar...</div>
        
        <!-- Lista med enbart de senaste 15 dagarna -->
        <ul id="logList" class="log-list"></ul>

        <!-- Enkel knapp längst ner för att tömma loggen -->
        <div class="footer-section">
            <button class="action-btn" onclick="clearLogs()">Töm logg</button>
        </div>
    </div>

    <script>
        // Byt ut mot din egen Firebase Realtime Database URL
        const firebaseURL = "https://medicinlogg-2ad29-default-rtdb.europe-west1.firebasedatabase.app/clicks.json";
        let isInitialLoad = true;

        // Funktion som skapar batteri-ikon baserat på spänning (3.0V - 4.2V)
        function getBatteryIcon(voltage) {
            if (voltage === undefined || voltage === null) {
                 return createSvgShell("#777", "");
            }

            let v = Math.max(3.0, Math.min(4.2, voltage));
            
            // Beräkna nivå 0-5 (där 4.2V ger nivå 5 och <=3.0V ger nivå 0)
            let level = Math.round(((v - 3.0) / 1.2) * 5);
            level = Math.max(0, Math.min(5, level));

            let color = "#4CAF50"; // Grön
            if (v <= 3.5) color = "#ff9800"; // Orange
            if (v <= 3.2) color = "#ff4d4d"; // Röd (kritisk)

            let barsHtml = '';
            // Bygg staplarna underifrån (i=1 är längst ner vid y=19, i=5 är högst upp vid y=7)
            for (let i = 1; i <= 5; i++) {
                let yPos = 22 - (i * 3);
                let fill = i <= level ? color : 'transparent';
                barsHtml += `<rect x="3" y="${yPos}" width="10" height="2" rx="0.5" fill="${fill}" />`;
            }

            return createSvgShell(color, barsHtml, voltage);
        }

        function createSvgShell(color, barsHtml, voltage = "") {
             return `
                <svg width="16" height="24" viewBox="0 0 16 24" style="vertical-align: middle; display: inline-block;" title="${voltage}V">
                    <rect x="5" y="1" width="6" height="2" rx="1" fill="${color}" />
                    <rect x="1" y="3" width="14" height="20" rx="3" fill="none" stroke="${color}" stroke-width="2" />
                    ${barsHtml}
                </svg>
            `;
        }

        async function fetchLogs() {
            try {
                const response = await fetch(firebaseURL);
                const data = await response.json();
                
                if (isInitialLoad) {
                    document.getElementById('loading').style.display = 'none';
                    isInitialLoad = false;
                }

                const logList = document.getElementById('logList');
                logList.innerHTML = '';

                if (!data) {
                    logList.innerHTML = '<li class="log-item" style="justify-content:center; color:#777; border-left-color:#555;">Inga loggar funna.</li>';
                    return;
                }

                const logs = Object.keys(data).map(key => ({
                    id: key,
                    timestamp: data[key].timestamp,
                    battery: data[key].battery
                })).sort((a, b) => b.timestamp - a.timestamp);

                const now = Date.now() / 1000;
                const fifteenDaysInSeconds = 15 * 24 * 60 * 60;
                let displayedCount = 0;

                logs.forEach(log => {
                    const ageInSeconds = now - log.timestamp;
                    
                    if (ageInSeconds <= fifteenDaysInSeconds) {
                        const dateObj = new Date(log.timestamp * 1000);
                        
                        const dateStr = dateObj.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
                        const timeStr = dateObj.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
                        
                        const batteryIcon = getBatteryIcon(log.battery);

                        const li = document.createElement('li');
                        li.className = 'log-item';
                        if (log.battery !== undefined && log.battery <= 3.2) {
                            li.classList.add('critical');
                        }
                        
                        li.innerHTML = `
                            <span class="log-date">${dateStr}</span>
                            <span class="log-time">${timeStr}</span>
                            <span class="log-battery">${batteryIcon}</span>
                        `;
                        logList.appendChild(li);
                        displayedCount++;
                    }
                });

                if (displayedCount === 0) {
                    logList.innerHTML = '<li class="log-item" style="justify-content:center; color:#777; border-left-color:#555;">Inga loggar de senaste 15 dagarna.</li>';
                }

            } catch (error) {
                console.error("Fel vid hämtning av data:", error);
                if (isInitialLoad) {
                    document.getElementById('loading').innerText = "Kunde inte ladda loggar. Kontrollera internetanslutning.";
                }
            }
        }

        async function clearLogs() {
            const pin = prompt("Ange PIN-kod för att tömma loggen (1956):");
            
            if (pin === null) return;

            if (pin === "1956") {
                try {
                    const response = await fetch(firebaseURL, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        alert("Loggen har tömts!");
                        location.reload();
                    } else {
                        alert("Kunde inte tömma loggen via servern.");
                    }
                } catch (error) {
                    console.error("Fel vid radering:", error);
                    alert("Ett fel uppstod vid anslutning till databasen.");
                }
            } else {
                alert("Felaktig PIN-kod!");
            }
        }

        fetchLogs();
        setInterval(fetchLogs, 10000);
    </script>
</body>
</html>
