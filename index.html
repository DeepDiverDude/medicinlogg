<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medicinlogg</title>
    
    <!-- Gör sidan snyggare i "app-mode" på mobil (PWA-stöd) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#121212">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ffffff;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
        }

        .log-list {
            list-style: none;
            width: 100%;
            flex-grow: 1;
        }

        .log-item {
            background: #1e1e1e;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            border-left: 4px solid #4CAF50;
        }

        .log-date {
            color: #b0b0b0;
        }

        .log-time {
            font-weight: bold;
            color: #ffffff;
        }

        .log-battery {
            font-size: 0.8rem;
            color: #888;
        }

        .footer-section {
            margin-top: 20px;
            width: 100%;
        }

        .action-btn {
            background: #2a1a1a;
            color: #ff6b6b;
            border: none;
            padding: 14px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            text-align: center;
        }

        .action-btn:active {
            background: #3a2222;
        }

        .loading {
            text-align: center;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MEDICINLOGG</h1>
        
        <div id="loading" class="loading">Hämtar loggar...</div>
        
        <!-- Lista med enbart de senaste 15 dagarna -->
        <ul id="logList" class="log-list"></ul>

        <!-- Enkel knapp längst ner för att tömma loggen -->
        <div class="footer-section">
            <button class="action-btn" onclick="clearLogs()">Töm logg</button>
        </div>
    </div>

    <script>
        // Byt ut mot din egen Firebase Realtime Database URL
        const firebaseURL = "https://medicinlogg-2ad29-default-rtdb.europe-west1.firebasedatabase.app/clicks.json";
        let isInitialLoad = true;

        async function fetchLogs() {
            try {
                const response = await fetch(firebaseURL);
                const data = await response.json();
                
                if (isInitialLoad) {
                    document.getElementById('loading').style.display = 'none';
                    isInitialLoad = false;
                }

                const logList = document.getElementById('logList');
                logList.innerHTML = '';

                if (!data) {
                    logList.innerHTML = '<li class="log-item" style="justify-content:center; color:#777; border-left-color:#555;">Inga loggar de senaste 15 dagarna.</li>';
                    return;
                }

                // Sortera nyast överst
                const logs = Object.keys(data).map(key => ({
                    id: key,
                    timestamp: data[key].timestamp,
                    battery: data[key].battery
                })).sort((a, b) => b.timestamp - a.timestamp);

                const now = Date.now() / 1000;
                const fifteenDaysInSeconds = 15 * 24 * 60 * 60;
                let displayedCount = 0;

                logs.forEach(log => {
                    const ageInSeconds = now - log.timestamp;
                    
                    // Filtrera bort allt som är äldre än 15 dagar
                    if (ageInSeconds <= fifteenDaysInSeconds) {
                        const dateObj = new Date(log.timestamp * 1000);
                        const dateStr = dateObj.toLocaleDateString('sv-SE', { month: 'short', day: 'numeric' });
                        const timeStr = dateObj.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' });
                        const batteryStr = log.battery ? `(${log.battery}V)` : '';

                        const li = document.createElement('li');
                        li.className = 'log-item';
                        li.innerHTML = `
                            <span class="log-date">${dateStr}</span>
                            <span class="log-time">${timeStr}</span>
                            <span class="log-battery">${batteryStr}</span>
                        `;
                        logList.appendChild(li);
                        displayedCount++;
                    }
                });

                if (displayedCount === 0) {
                    logList.innerHTML = '<li class="log-item" style="justify-content:center; color:#777; border-left-color:#555;">Inga loggar de senaste 15 dagarna.</li>';
                }

            } catch (error) {
                console.error("Fel vid hämtning av data:", error);
                if (isInitialLoad) {
                    document.getElementById('loading').innerText = "Kunde inte ladda loggar.";
                }
            }
        }

        async function clearLogs() {
            const pin = prompt("Ange PIN-kod för att tömma loggen:");
            
            if (pin === null) return;

            if (pin === "1956") {
                try {
                    const response = await fetch(firebaseURL, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        alert("Loggen har tömts!");
                        location.reload();
                    } else {
                        alert("Kunde inte tömma loggen via servern.");
                    }
                } catch (error) {
                    console.error("Fel vid radering:", error);
                    alert("Ett fel uppstod vid anslutning till databasen.");
                }
            } else {
                alert("Felaktig PIN-kod!");
            }
        }

        // Hämta direkt och uppdatera automatiskt var 10:e sekund
        fetchLogs();
        setInterval(fetchLogs, 10000);
    </script>
</body>
</html>
